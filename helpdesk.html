<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="CWA Help Desk appointment booking form">
  <meta name="keywords" content="help desk, appointment, HTML, form">
  <meta name="author" content="Mubashir">
  <title>CWA Help Desk Appointment</title>
</head>
<body>
  <a href="http://www.swin.edu.au"><img src="logo.png" alt="Swinburne logo"></a>
  <h1>CWA Help Desk Appointment</h1>
  <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
  <p>Check Blackboard for when CWA tutors will be there.</p>

  <form method="post" action="#">

    <fieldset>
      <legend>Student details</legend>
      <p>
        <label for="studentid">Student ID</label>
        <input type="text" id="studentid" name="studentid" required pattern="\d{7,10}" title="Enter 7 to 10 digits">
      </p>
      <p>
        <label for="givenname">Given Name</label>
        <input type="text" id="givenname" name="givenname" maxlength="15" required pattern="[A-Za-z]+" title="Letters only">
        <label for="familyname">Family Name</label>
        <input type="text" id="familyname" name="familyname" maxlength="15" required pattern="[A-Za-z]+" title="Letters only">
      </p>
    </fieldset>

    <fieldset>
      <legend>Your unit</legend>
      <p>
        <input type="radio" id="cos10011" name="unit" value="COS10011" required>
        <label for="cos10011">COS10011</label>
        <input type="radio" id="cos60004" name="unit" value="COS60004">
        <label for="cos60004">COS60004</label>
        <input type="radio" id="cos60007" name="unit" value="COS60007">
        <label for="cos60007">COS60007</label>
      </p>
      <p>
        <label for="tutor">Your Tutor</label>
        <select id="tutor" name="tutor" required>
          <option value="">Please Select</option>
          <option value="tutor1">Alex Smith</option>
          <option value="tutor2">Maria Garcia</option>
          <option value="tutor3">John Lee</option>
        </select>
      </p>
    </fieldset>

    <fieldset>
      <legend>Issue</legend>
      <p>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="issue[]" value="HTML" checked="checked">
        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="issue[]" value="CSS">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="js" name="issue[]" value="JavaScript">
        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="issue[]" value="PHP">
        <label for="mysql">MySQL</label>
        <input type="checkbox" id="mysql" name="issue[]" value="MySQL">
      </p>
      <p>
        <label for="description">Description of Issue</label><br>
        <textarea id="description" name="description" rows="5" cols="40" placeholder="Write description of your problem here..."></textarea>
      </p>
    </fieldset>

    <fieldset>
      <legend>Preferred Date / Time</legend>
      <p>
        <label for="date">Date</label>
        <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" required pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/\d{4}" title="Format: dd/mm/yyyy">
      </p>
      <p>
        <label for="time">Time</label>
        <input type="text" id="time" name="time" placeholder="00:00" required pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" title="Format: hh:mm (24-hour)">
      </p>
    </fieldset>

    <input type="submit" value="Book">
    <input type="reset" value="Reset form">

  </form>
</body>
</html>
